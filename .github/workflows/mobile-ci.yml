name: mobile-ci

on:
  push:
    paths:
      - "mobile/**"
      - "contracts/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "contracts/**"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"

defaults:
  run:
    working-directory: mobile

jobs:
  analyze:
    name: analyze · format · forbidden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # #B-138: `gen-l10n` formatlanmagan kod chiqaradi va uni `flutter pub get`
      # / `flutter build` istalgan paytda qayta yozadi — shu sababli format
      # job'i vaqti-vaqti bilan qizarardi. Generatsiya natijasi tekshiruvdan
      # oldin normallashtiriladi (`tool/merge_arb.sh` ham shuni qiladi),
      # tekshiruvning o'zi qo'lda yozilgan kodga qoladi.
      - name: l10n generatsiyasini formatlash
        run: dart format --line-length=100 lib/l10n/generated
      - name: dart format
        run: dart format --output=none --set-exit-if-changed --line-length=100 .
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --fatal-warnings
      - name: taqiqlar grepi
        run: bash tool/check_forbidden.sh

  test:
    name: unit + widget test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test test_goldens --reporter=expanded

  hos-parity:
    name: hos_engine (sof Dart) golden vektorlar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: hos_engine mavjudligini tekshirish
        id: probe
        run: |
          if [ -f packages/hos_engine/pubspec.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: dart test + flutter bog'liqligi yo'qligi (M4)
        if: steps.probe.outputs.present == 'true'
        working-directory: mobile/packages/hos_engine
        run: |
          dart pub get
          dart pub deps --json | grep -q '"name": "flutter"' && {
            echo "M4 buzildi: hos_engine flutter ga bog'langan"; exit 1; }
          dart test

  api-contract:
    name: eld_api kontrakt diffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: openapi-generator o'rnatish
        run: npm install -g @openapitools/openapi-generator-cli
      - name: generatsiya + diff tekshiruvi
        run: bash tool/generate_api.sh --check

  build-apk:
    name: build apk (debug)
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define-from-file=env/dev.json
