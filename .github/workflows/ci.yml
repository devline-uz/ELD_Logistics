name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: admin — typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      # Step-level `if:` faqat `env` ni ko'ra oladi, `secrets` ni emas.
      DOCS_TOKEN: ${{ secrets.DOCS_TOKEN }}
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # 9.4: boshlang'ich JS <= 250 KB gzip (TZ §12 F192). Skript qo'shimcha
      # ravishda `index.html` da inline `<script>` yo'qligini (CSP script-src
      # 'self') va prod bundle'da `console.*` qolmaganini (F206) tekshiradi.
      - name: Bundle budget · inline-script · console.* gate
        run: npm run bundle:budget

      # fe-security F210 (MUST): zaifliklarga qarshi darvoza.
      # Prod bog'liqliklari (`--omit=dev`) bloklovchi — bundle'ga tushadigan
      # narsa. Dev-only zaifliklar (vite/vitest/@vitest/coverage-v8 kabi)
      # bundle'ga tushmaydi, shuning uchun ular alohida, faqat ogohlantiruvchi
      # qadamda ko'rsatiladi va build'ni yiqitmaydi.
      # fe-security F210 (MUST): zaifliklarga qarshi darvoza.
      # 9.10 dan keyin `high`/`critical` **butun daraxtda** 0 — shuning uchun
      # dev bog'liqliklari ham bloklovchi. Prod uchun alohida, qat'iyroq
      # qadam qoldirilgan: bundle'ga tushadigan narsa hech qachon regressiya
      # qilmasligi kerak.
      #
      # Qolgan (bloklamaydigan) zaiflik: react-router-dom 6.x — 2 ta
      # `moderate`. Yagona tuzatish yo'li — 7.x (breaking major).
      # Qaror va reja: docs/tz/16-17-registry-open-questions.md -> D46.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (blocking)
        run: npm audit --audit-level=high

      # Uch bosqichli klient generatsiyasi (fe-api §2):
      #   openapi/swagger.json (fetch, DOCS_TOKEN kerak)
      #     -> openapi/openapi3.json (convert, tarmoq kerak emas)
      #     -> src/api/schema.d.ts (gen, tarmoq kerak emas)
      # `api:convert` va `api:gen` committed `swagger.json`dan ishlaydi, shuning
      # uchun DOCS_TOKEN bo'lmasa ham har CI ishga tushishida bajariladi — bu
      # generatsiya skriptlaridagi yoki qo'lda tahrirlangan artefaktlardagi
      # driftni ushlaydi. `api:fetch` (haqiqiy backendga so'rov) faqat
      # `DOCS_TOKEN` secret mavjud bo'lsa qo'shiladi — u spec'ning o'zi
      # backendda o'zgarganini ushlaydi.
      - name: Fetch the latest swagger spec
        if: ${{ env.DOCS_TOKEN != '' }}
        env:
          VITE_API_DOCS_URL: ${{ vars.VITE_API_DOCS_URL || 'https://eldapi.stackyard.uz/api/docs' }}
        run: npm run api:fetch

      - name: Convert Swagger 2.0 -> OpenAPI 3 and regenerate types
        run: npm run api:convert && npm run api:gen

      - name: Fail if the committed spec/types drifted from generation
        run: |
          if [ "$DOCS_TOKEN" != "" ]; then
            git diff --exit-code -- openapi/swagger.json openapi/openapi3.json src/api/schema.d.ts
          else
            git diff --exit-code -- openapi/openapi3.json src/api/schema.d.ts
          fi

  lighthouse:
    # 9.3 — Lighthouse (TZ §14.3: Performance >= 90, Accessibility >= 95,
    # Best Practices >= 95). BLOKLOVCHI EMAS (`continue-on-error`): natija
    # runner yuki va tarmoq shovqiniga sezgir, shuning uchun u signal beradi,
    # PR ni yiqitmaydi. Haqiqiy darvoza — `admin` job'idagi bundle byudjeti.
    name: admin — lighthouse (bloklamaydi)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Skript o'lchov uchun alohida prod build qiladi (`dist-lh/`, MSW
      # yoqilgan) va `lighthouse` + `chrome-launcher` ni `.lh-tools/` ga
      # o'rnatadi — ular ilova bog'liqligi emas, shuning uchun
      # `package.json` da yo'q. Chrome ubuntu-latest obrazida mavjud.
      - name: Lighthouse (login · dashboard · units · tracking)
        run: npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: admin/dist-lh/reports
          retention-days: 7
          if-no-files-found: ignore
