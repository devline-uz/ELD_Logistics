name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: admin — typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      # Step-level `if:` faqat `env` ni ko'ra oladi, `secrets` ni emas.
      DOCS_TOKEN: ${{ secrets.DOCS_TOKEN }}
    defaults:
      run:
        working-directory: admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # fe-security F210 (MUST): zaifliklarga qarshi darvoza.
      # Prod bog'liqliklari (`--omit=dev`) bloklovchi — bundle'ga tushadigan
      # narsa. Dev-only zaifliklar (vite/vitest/@vitest/coverage-v8 kabi)
      # bundle'ga tushmaydi, shuning uchun ular alohida, faqat ogohlantiruvchi
      # qadamda ko'rsatiladi va build'ni yiqitmaydi.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev dependencies (warning only)
        continue-on-error: true
        run: npm audit --audit-level=high

      # Uch bosqichli klient generatsiyasi (fe-api §2):
      #   openapi/swagger.json (fetch, DOCS_TOKEN kerak)
      #     -> openapi/openapi3.json (convert, tarmoq kerak emas)
      #     -> src/api/schema.d.ts (gen, tarmoq kerak emas)
      # `api:convert` va `api:gen` committed `swagger.json`dan ishlaydi, shuning
      # uchun DOCS_TOKEN bo'lmasa ham har CI ishga tushishida bajariladi — bu
      # generatsiya skriptlaridagi yoki qo'lda tahrirlangan artefaktlardagi
      # driftni ushlaydi. `api:fetch` (haqiqiy backendga so'rov) faqat
      # `DOCS_TOKEN` secret mavjud bo'lsa qo'shiladi — u spec'ning o'zi
      # backendda o'zgarganini ushlaydi.
      - name: Fetch the latest swagger spec
        if: ${{ env.DOCS_TOKEN != '' }}
        env:
          VITE_API_DOCS_URL: ${{ vars.VITE_API_DOCS_URL || 'https://eldapi.stackyard.uz/api/docs' }}
        run: npm run api:fetch

      - name: Convert Swagger 2.0 -> OpenAPI 3 and regenerate types
        run: npm run api:convert && npm run api:gen

      - name: Fail if the committed spec/types drifted from generation
        run: |
          if [ "$DOCS_TOKEN" != "" ]; then
            git diff --exit-code -- openapi/swagger.json openapi/openapi3.json src/api/schema.d.ts
          else
            git diff --exit-code -- openapi/openapi3.json src/api/schema.d.ts
          fi
