# ELD Admin Panel — xavfsizlik header'lari (F203, F204).
# Har `location` blokida include qilinadi, chunki nginx'da `add_header`
# meros olinmaydi. `$eld_csp` o'zgaruvchisi `csp.conf` da aniqlanadi.

# --- CSP ---------------------------------------------------------------
# 1-bosqich (rollout): faqat kuzatish — quyidagi Report-Only satrini yoqing,
#                      pastdagi bloklovchi satrni izohga oling.
# 2-bosqich: `docs/deploy.md` §6 chek-listi toza bo'lsa — teskarisi.
# add_header Content-Security-Policy-Report-Only $eld_csp always;
add_header Content-Security-Policy $eld_csp always;

# --- HSTS --------------------------------------------------------------
# 2 yil + subdomenlar. `preload` ni faqat butun `stackyard.uz` HTTPS'ga
# to'liq o'tgandan keyin qo'shing (orqaga qaytarish deyarli imkonsiz).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# --- Qolganlari ---------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;                 # CSP frame-ancestors zaxirasi
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;       # index.html dagi meta bilan mos
