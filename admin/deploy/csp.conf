# ELD Admin Panel — Content-Security-Policy manbalari (F203).
#
# Bu fayl `nginx.conf` ichiga `include` qilinadi va CSP satrini bitta
# `$eld_csp` o'zgaruvchisiga yig'adi, shunda uni `Content-Security-Policy`
# yoki `Content-Security-Policy-Report-Only` sifatida bir xil qiymat bilan
# berish mumkin (rollout bosqichlari — `docs/deploy.md` §6).
#
# Manbalar `admin/.env.example` dan olinadi:
#   VITE_API_BASE_URL  = https://eldapi.stackyard.uz/api/v1   -> connect-src
#   VITE_WS_URL        = wss://eldapi.stackyard.uz/api/v1/ws  -> connect-src
#   VITE_MAP_STYLE_URL = https://api.maptiler.com/...         -> connect/img
#   VITE_FILES_BASE_URL / VITE_FILES_UPLOAD_HOST              -> connect/img
#
# ⚠️ Fayl hosti (S3/MinIO) prod'da aniqlangach quyidagi ikki `map` blokidagi
# `https://files.stackyard.uz` o'rniga haqiqiy host yoziladi. Presign
# `upload_url` shu hostga `PUT` qiladi — `connect-src` da bo'lishi SHART.

# ⚠️ Sentry (9.12): `VITE_SENTRY_DSN` to'ldirilsa, DSN dagi host
# `connect-src` ga QO'SHILISHI SHART — aks holda SDK hodisalari CSP
# tomonidan bloklanadi. Host DSN ning ikkinchi qismidan olinadi:
#   https://<public-key>@<ORG_ID>.ingest.<REGION>.sentry.io/<project>
#   -> https://<ORG_ID>.ingest.<REGION>.sentry.io
# Quyidagi qatorga qo'shiladi (namuna, DSN'siz aniq host noma'lum):
#   default "... https://o0000000.ingest.de.sentry.io";
# Self-hosted Sentry bo'lsa — o'sha o'rnatmaning to'liq origin'i.
map $host $eld_csp_connect {
    default "https://eldapi.stackyard.uz wss://eldapi.stackyard.uz https://api.maptiler.com https://files.stackyard.uz";
}

map $host $eld_csp_img {
    default "https://api.maptiler.com https://files.stackyard.uz";
}

map $host $eld_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: $eld_csp_img; font-src 'self'; connect-src 'self' $eld_csp_connect; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; media-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
}

# Direktivalar bo'yicha izoh (nega aynan shunday):
#
#   script-src 'self'
#       'unsafe-inline' va 'unsafe-eval' YO'Q (F203). Vite prod build inline
#       skript yaratmaydi — `index.html` da faqat `<script type="module"
#       src="/assets/...">`. Buni `npm run bundle:budget` tekshiradi.
#
#   style-src 'self' 'unsafe-inline'
#       'unsafe-inline' ikki sabab bilan MAJBURIY:
#         1) MapLibre GL runtime'da `<style>` tugunini DOM'ga qo'shadi
#            (marker/popup/control CSS'i) — nonce qo'yib bo'lmaydi;
#         2) React `style={{...}}` prop'i inline `style` atributini beradi
#            (virtual list balandligi, xarita overlay pozitsiyasi).
#       Tailwind build vaqtida statik CSS chiqaradi va bunga muhtoj emas.
#       CSP Level 3 `'unsafe-hashes'` bu holatlarni qoplamaydi, chunki
#       stil qiymatlari runtime'da hisoblanadi.
#
#   img-src 'self' data: blob: <maptiler> <files>
#       `data:` — QR kod (`qrcode` kutubxonasi data-URL beradi) va inline SVG
#       ikonkalar; `blob:` — MapLibre canvas snapshot va yuklashdan oldingi
#       fayl preview'i; maptiler — raster tile'lar; files host — DVIR foto va
#       imzolari.
#
#   worker-src 'self' blob:
#       MapLibre GL o'z worker'ini `blob:` URL'idan yaratadi.
#
#   connect-src
#       API (https), WebSocket (wss), MapTiler style/tile JSON, fayl hosti
#       (presign PUT + GET). `'self'` — `/assets/*` va manifest.
#
#   frame-ancestors 'none' + X-Frame-Options: DENY
#       Clickjacking. Panel hech qachon iframe ichida ochilmaydi.
#
#   object-src 'none'; base-uri 'self'; form-action 'self'
#       Plugin injection va base-tag/form hijack himoyasi.
