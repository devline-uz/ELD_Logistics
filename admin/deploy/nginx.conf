# ELD Admin Panel — nginx konfiguratsiyasi (eldadmin.stackyard.uz)
#
# Vazifalar: 9.9 (CSP + xavfsizlik header'lari), 9.11 (statik deploy, SPA
# fallback, gzip, cache), 9.12 (sourcemap serverdan berilmaydi).
# To'liq deploy qo'llanmasi: ../../docs/deploy.md
#
# Joylashuv: /etc/nginx/sites-available/eldadmin.conf
# `csp.conf` `http {}` konteksida include qilinadi (unda `map` direktivalari bor):
#     http { include /etc/nginx/eld/csp.conf; ... }

# --- gzip (http{} konteksi; bu yerda ma'lumot uchun keltirilgan) ------------
# gzip              on;
# gzip_comp_level   6;
# gzip_min_length   1024;
# gzip_vary         on;
# gzip_proxied      any;
# gzip_types        text/plain text/css text/javascript application/javascript
#                   application/json application/manifest+json image/svg+xml;
#
# Brotli (tavsiya, ngx_brotli moduli kerak — Debian'da `libnginx-mod-brotli`):
# brotli            on;
# brotli_comp_level 5;
# brotli_static     on;   # `dist/*.br` oldindan siqilgan fayllarni beradi
# brotli_types      <gzip_types bilan bir xil ro'yxat>;
#
# `brotli_static on` bo'lsa build'dan keyin `find dist -type f \
#   \( -name '*.js' -o -name '*.css' \) -exec brotli -kf {} \;` bajariladi.

server {
    listen 80;
    listen [::]:80;
    server_name eldadmin.stackyard.uz;

    # ACME (certbot) dan tashqari hamma narsa HTTPS'ga.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eldadmin.stackyard.uz;

    ssl_certificate     /etc/letsencrypt/live/eldadmin.stackyard.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eldadmin.stackyard.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    root  /var/www/eldadmin;
    index index.html;

    charset       utf-8;
    server_tokens off;

    # ---------------------------------------------------------------------
    # Xavfsizlik header'lari (F203, F204).
    #
    # `add_header` nginx'da MEROSXO'R EMAS: ichki `location` bloki o'z
    # `add_header` ini e'lon qilsa, server darajasidagilar YO'QOLADI.
    # Shu sababli ular alohida faylga chiqarilib, har `location` da qayta
    # include qilinadi. Har o'zgarishda ikkalasi ham yangilanadi.
    # ---------------------------------------------------------------------
    include /etc/nginx/eld/security-headers.conf;

    # --- SPA fallback -----------------------------------------------------
    # Barcha noma'lum yo'llar `index.html` ga tushadi; 404 ni React Router
    # hal qiladi (`app/router.tsx` -> NotFoundPage).
    location / {
        include /etc/nginx/eld/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # --- index.html: hech qachon keshlanmaydi -----------------------------
    # Yangi deploy'dan keyin foydalanuvchi eski `index.html` ni olsa, u
    # o'chirilgan hash'li chunk'larga murojaat qiladi -> oq ekran.
    location = /index.html {
        include /etc/nginx/eld/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # --- Hash'langan assetlar: bir yil, immutable -------------------------
    # Vite fayl nomiga content-hash qo'yadi (`index-B7dK2p.js`), shuning
    # uchun revalidatsiya kerak emas.
    location ^~ /assets/ {
        include /etc/nginx/eld/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Sourcemap'lar hech qachon berilmaydi (F211 / TD8) ----------------
    # `build.sourcemap: 'hidden'` bo'lgani uchun brauzer ularni so'ramaydi,
    # lekin fayllar `dist/` da yaratiladi. Deploy `rsync --exclude '*.map'`
    # bilan ularni ko'chirmaydi; bu blok — ikkinchi qatlam himoya
    # (qo'lda `scp dist/` qilinsa ham manba kodi ochilmaydi).
    location ~* \.map$ { return 404; }

    # --- MSW (e2e mock) worker'i hech qachon berilmaydi --------------------
    # `vite.config.ts` prod build'da `dist/mockServiceWorker.js` ni o'chiradi;
    # bu blok — ikkinchi qatlam (eski/qo'lda ko'chirilgan deploy uchun).
    # Ro'yxatdan o'tgan service worker butun API trafigini ushlab qolardi.
    location = /mockServiceWorker.js { return 404; }

    # --- Yashirin fayllar -------------------------------------------------
    location ~ /\. { deny all; }

    # --- Favicon / robots -------------------------------------------------
    location = /robots.txt {
        include /etc/nginx/eld/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Yuklanadigan eksport fayllari API orqali keladi — bu yerda proxy yo'q.
    client_max_body_size 1m;
}
