name: hos_engine
description: >-
  Pure Dart port of the Go `internal/hos` Hours of Service engine. Bit-for-bit
  identical results are enforced by the shared golden vectors (Q10.8, M44).
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.12.2

# M44: no `flutter` dependency, direct or transitive. Verified by
# test/no_flutter_dependency_test.dart and the `hos-parity` CI job.
dependencies:
  meta: ^1.16.0
  timezone: ^0.11.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
  crypto: ^3.0.7
