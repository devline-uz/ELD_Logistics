version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    strict_function_checks: false
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          # Continuous aggregate'lar (Timescale `last()` sqlc uchun noma'lum) — aniq tiplar.
          # Xom `telemetry` jadvali bilan bir xil: nullable float -> *float64, numeric -> pgtype.Numeric.
          - column: "telemetry_1min.bucket"
            go_type: time.Time
          - column: "telemetry_1min.avg_speed_kmh"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_1min.max_speed_kmh"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_1min.last_lat"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_1min.last_lng"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_1min.last_heading"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_1min.last_fuel_pct"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_1min.max_odometer_m"
            go_type:
              type: "int64"
              pointer: true
          - column: "telemetry_1min.max_engine_hours"
            go_type: github.com/jackc/pgx/v5/pgtype.Numeric
          - column: "telemetry_5min.bucket"
            go_type: time.Time
          - column: "telemetry_5min.avg_speed_kmh"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_5min.max_speed_kmh"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_5min.last_lat"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_5min.last_lng"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_5min.last_heading"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_5min.last_fuel_pct"
            go_type:
              type: "float64"
              pointer: true
          - column: "telemetry_5min.max_odometer_m"
            go_type:
              type: "int64"
              pointer: true
          - column: "telemetry_5min.max_engine_hours"
            go_type: github.com/jackc/pgx/v5/pgtype.Numeric
