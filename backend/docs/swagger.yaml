        description: |-
          OdometerChangeM is Q75: End − Start. It is zero when the window holds no
          telemetry at all.
        example: 750000
        type: integer
      start_odometer_m:
        description: StartOdometerM is the first odometer reading in the window, in
          metres.
        example: 128430000
        type: integer
      subject_id:
        description: SubjectID is the driver or unit the row describes.
        example: 2f1a1b3c-4d5e-6f70-8192-a3b4c5d6e7f8
        type: string
      subject_type:
        description: SubjectType tells which of the two the row describes.
        enum:
        - drivers
        - units
        example: units
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_reports_dto.DistanceByRegionEnvelope:
