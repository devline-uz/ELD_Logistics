basePath: /api/v1
definitions:
  github_com_devline_onebook-eld_internal_domain_auditlog_dto.Entry:
    properties:
      action:
        enum:
        - insert
        - create
        - update
        - soft_delete
        - delete
        - restore
        - login
        - logout
        - failed_login
        - export
        - permission_change
        - log_edit_request
        - hos_policy_change
        - token_reuse
        - cross_tenant_attempt
        - certify
        - assign
        - approve
        - reject
        - license_reveal
        example: update
        type: string
      edited_by:
        description: EditedBy is the acting user, null for system jobs.
        example: 8d3e2f1a-4b5c-4d6e-9f70-1a2b3c4d5e6f
        type: string
      edited_by_name:
        example: Anna Ross
        type: string
      field:
        example: status
        type: string
      id:
        example: 3c9a1f2e-5d4b-4a6c-8e1f-0d2b3a4c5e6f
        type: string
      ip:
        example: 203.0.113.24
        type: string
      masked:
        description: Masked reports that at least one of the two values was redacted.
        example: false
        type: boolean
      new_value:
        description: NewValue is the masked value after the change, null on delete.
        example: in_progress
        type: string
      old_value:
        description: |-
          OldValue is the masked value before the change, null on insert. The
          stored shape is whatever the audited column held (a string, a number, a
          JSON object); swag cannot type an `any`, so the schema renders it as a
          free form string.
        example: new
        type: string
      reason:
        example: driver requested correction
        type: string
      record_id:
        description: RecordID is the audited row, null for account wide events such
          as login.
        example: 6f1a1a5e-1b4a-4d0d-9f2e-1c2b3a4d5e6f
        type: string
      table:
        description: TableName is the audited table, e.g. `units` or `support_tickets`.
        example: support_tickets
        type: string
      ts:
        example: "2026-09-07T11:30:00Z"
        format: date-time
        type: string
      user_agent:
        example: Mozilla/5.0
        type: string
      username:
        example: anna.ross
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_auditlog_dto.EntryListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.Entry'
        type: array
      meta:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.Meta'
    type: object
  github_com_devline_onebook-eld_internal_domain_auditlog_dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_httpx_dto.ErrorBody'
    type: object
  github_com_devline_onebook-eld_internal_domain_auditlog_dto.Meta:
    properties:
      page:
        example: 1
        type: integer
      per_page:
        example: 25
        type: integer
      total:
        example: 123
        type: integer
    type: object
  github_com_devline_onebook-eld_internal_domain_auditlog_dto.TableListEnvelope:
    properties:
      data:
        example:
        - support_tickets
        items:
          type: string
        type: array
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.AppConfig:
    properties:
      access_token_ttl_seconds:
        description: AccessTokenTTLSeconds lets a client schedule its refresh.
        example: 900
        type: integer
      feature_flags:
        additionalProperties:
          type: boolean
        description: FeatureFlags toggles optional modules per deployment.
        type: object
      force_update:
        example: false
        type: boolean
      latest_version:
        example: 1.4.2
        type: string
      min_supported_version:
        example: 1.0.0
        type: string
      server_time:
        description: ServerTime lets the client detect clock drift before signing
          events.
        example: "2026-09-06T05:12:00Z"
        format: date-time
        type: string
      support_email:
        description: SupportEmail is shown on the mobile about screen.
        example: support@onebook-eld.com
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.AppConfigEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.AppConfig'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_httpx_dto.ErrorBody'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.InvitationAcceptRequest:
    properties:
      password:
        example: Str0ngPassphrase
        maxLength: 128
        minLength: 10
        type: string
      pin:
        description: PIN optionally sets the 6 digit driver PIN in the same call.
        example: "483920"
        type: string
      token:
        example: Zr4KpN1vQ8sT2mL5xB7cD0eF3gH6jI9k
        maxLength: 256
        type: string
    required:
    - password
    - token
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.LoginEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.LoginResult'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.LoginRequest:
    properties:
      app_version:
        example: 1.4.2
        maxLength: 32
        type: string
      company_id:
        description: |-
          CompanyID disambiguates a username that exists in several tenants. It is
          a pre-authentication hint only: the effective tenant always comes from
          the resolved user row, never from this field.
        example: 3f7c2d1a-9b5e-4c8d-8e2f-1a2b3c4d5e6f
        type: string
      device_id:
        example: 7c9f2f1e-2b4a-4f7d-9a1e-0f2b3c4d5e6f
        maxLength: 128
        type: string
      device_type:
        description: DeviceType decides which of the three concurrent session slots
          is used.
        enum:
        - web
        - phone
        - tablet
        example: web
        type: string
      password:
        example: Str0ngPassphrase
        maxLength: 128
        minLength: 1
        type: string
      totp_code:
        description: TOTPCode is required once two factor authentication is enabled.
        example: "123456"
        type: string
      username:
        example: jdoe
        maxLength: 128
        type: string
    required:
    - device_type
    - password
    - username
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.LoginResult:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIifQ.sig
        type: string
      expires_in:
        description: ExpiresIn is the access token lifetime in seconds.
        example: 900
        type: integer
      refresh_expires_at:
        description: RefreshExpiresAt is when the refresh window closes.
        example: "2026-10-06T05:12:00Z"
        format: date-time
        type: string
      refresh_token:
        description: RefreshToken is empty while the session is limited to 2FA enrolment.
        example: o1Wm4c9vJ3xQ7pL0aZ2bY5nR8tK6sD4fH1gU3jE
        type: string
      replaced_session:
        description: |-
          ReplacedSession reports that another session of the same device type was
          revoked by this login (TZ A§20).
        example: false
        type: boolean
      requires_totp_setup:
        description: |-
          RequiresTOTPSetup marks a limited token: the account must enrol in two
          factor authentication before anything else is permitted.
        example: false
        type: boolean
      session_id:
        description: SessionID identifies the session created by this login.
        example: 9e2c4a1b-7d3f-4e5a-8b6c-0d1e2f3a4b5c
        type: string
      subscription_readonly:
        description: |-
          SubscriptionReadonly reports that the company subscription lapsed and
          only read operations are accepted.
        example: false
        type: boolean
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.Profile'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.LogoutRequest:
    properties:
      pause:
        description: Pause keeps the session recoverable with a PIN (Leave Truck).
        example: false
        type: boolean
      refresh_token:
        description: RefreshToken optionally targets one session explicitly.
        example: o1Wm4c9vJ3xQ7pL0aZ2bY5nR8tK6sD4fH1gU3jE
        maxLength: 256
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.MessageEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.MessageResponse'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.MessageResponse:
    properties:
      message:
        example: ok
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.Meta:
    properties:
      page:
        example: 1
        type: integer
      per_page:
        example: 25
        type: integer
      total:
        example: 123
        type: integer
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.PINVerified:
    properties:
      action:
        enum:
        - switch_driver
        - return_to_truck
        example: return_to_truck
        type: string
      session_resumed:
        description: SessionResumed reports that a paused session was reactivated.
        example: true
        type: boolean
      verified:
        example: true
        type: boolean
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.PINVerifiedEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.PINVerified'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.PINVerifyRequest:
    properties:
      action:
        description: Action selects what the verified PIN unlocks.
        enum:
        - switch_driver
        - return_to_truck
        example: return_to_truck
        type: string
      pin:
        example: "483920"
        type: string
    required:
    - pin
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.PasswordForgotRequest:
    properties:
      login:
        description: Login is the username or the email address of the account.
        example: jdoe
        maxLength: 254
        type: string
    required:
    - login
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.PasswordResetRequest:
    properties:
      password:
        example: Str0ngPassphrase
        maxLength: 128
        minLength: 10
        type: string
      token:
        example: Zr4KpN1vQ8sT2mL5xB7cD0eF3gH6jI9k
        maxLength: 256
        type: string
    required:
    - password
    - token
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.Profile:
    properties:
      branch_id:
        example: 8a7b6c5d-4e3f-2a1b-0c9d-8e7f6a5b4c3d
        type: string
      company_id:
        description: CompanyID is empty for platform (super admin) accounts.
        example: 3f7c2d1a-9b5e-4c8d-8e2f-1a2b3c4d5e6f
        type: string
      email:
        description: Email is masked for anyone but the account owner.
        example: j***e@example.com
        type: string
      first_name:
        example: John
        type: string
      id:
        example: 5c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
        type: string
      is_super_admin:
        example: false
        type: boolean
      last_login_at:
        example: "2026-09-06T05:12:00Z"
        format: date-time
        type: string
      last_name:
        example: Doe
        type: string
      permissions:
        example:
        - units.read
        - drivers.read
        items:
          type: string
        type: array
      pin_set:
        example: true
        type: boolean
      role_id:
        example: 1b2c3d4e-5f6a-7b8c-9d0e-1f2a3b4c5d6e
        type: string
      role_name:
        example: Fleet Manager
        type: string
      scope:
        enum:
        - company
        - branch
        - self
        example: company
        type: string
      status:
        enum:
        - invited
        - active
        - inactive
        example: active
        type: string
      totp_enabled:
        example: true
        type: boolean
      username:
        example: jdoe
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.ProfileEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.Profile'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.RefreshRequest:
    properties:
      app_version:
        example: 1.4.2
        maxLength: 32
        type: string
      refresh_token:
        example: o1Wm4c9vJ3xQ7pL0aZ2bY5nR8tK6sD4fH1gU3jE
        maxLength: 256
        type: string
    required:
    - refresh_token
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.Session:
    properties:
      app_version:
        example: 1.4.2
        type: string
      created_at:
        example: "2026-09-06T05:12:00Z"
        format: date-time
        type: string
      current:
        example: true
        type: boolean
      device_id:
        example: 7c9f2f1e-2b4a-4f7d-9a1e-0f2b3c4d5e6f
        type: string
      device_type:
        enum:
        - web
        - phone
        - tablet
        example: phone
        type: string
      expires_at:
        example: "2026-10-06T05:12:00Z"
        format: date-time
        type: string
      id:
        example: 9e2c4a1b-7d3f-4e5a-8b6c-0d1e2f3a4b5c
        type: string
      ip:
        description: IP is truncated; the full address stays in the audit trail only.
        example: 203.0.113.0
        type: string
      last_seen_at:
        example: "2026-09-06T07:40:00Z"
        format: date-time
        type: string
      status:
        enum:
        - active
        - paused
        - revoked
        example: active
        type: string
      user_agent:
        example: ONEBOOK-ELD/1.4.2 (Android 14)
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.SessionListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.Session'
        type: array
      meta:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.Meta'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPSetup:
    properties:
      digits:
        description: Digits and Period describe the expected authenticator configuration.
        example: 6
        type: integer
      issuer:
        example: ONEBOOK ELD
        type: string
      otpauth_url:
        description: OtpauthURL is rendered as a QR code by the client.
        example: otpauth://totp/ONEBOOK%20ELD:jdoe?secret=JBSWY3DPEHPK3PXP&issuer=ONEBOOK%20ELD
        type: string
      period:
        example: 30
        type: integer
      secret:
        description: |-
          Secret is the base32 value for manual entry. It is shown once and is
          stored AES-256-GCM encrypted.
        example: JBSWY3DPEHPK3PXP
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPSetupEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPSetup'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPVerified:
    properties:
      enabled:
        example: true
        type: boolean
      recovery_codes:
        description: |-
          RecoveryCodes are shown exactly once, at enrolment. Only their hashes
          are stored and each code works a single time.
        example:
        - 3f9a1c2d4e6b8a0c1d2e
        - 7b1c9d0e2f3a4b5c6d7e
        items:
          type: string
        type: array
      tokens:
        allOf:
        - $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.Tokens'
        description: Tokens is filled when the verification upgraded a limited session.
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPVerifiedEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPVerified'
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPVerifyRequest:
    properties:
      code:
        example: "123456"
        type: string
      recovery_code:
        description: RecoveryCode is accepted instead of Code when the device is lost.
        example: 3f9a1c2d4e6b8a0c1d2e
        maxLength: 64
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.Tokens:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIifQ.sig
        type: string
      expires_in:
        description: ExpiresIn is the access token lifetime in seconds.
        example: 900
        type: integer
      refresh_expires_at:
        description: RefreshExpiresAt is when the refresh window closes.
        example: "2026-10-06T05:12:00Z"
        format: date-time
        type: string
      refresh_token:
        description: RefreshToken is empty while the session is limited to 2FA enrolment.
        example: o1Wm4c9vJ3xQ7pL0aZ2bY5nR8tK6sD4fH1gU3jE
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_auth_dto.TokensEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.Tokens'
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.CursorMeta:
    properties:
      has_more:
        description: HasMore reports whether older messages exist.
        example: true
        type: boolean
      next_before:
        description: NextBefore is the cursor to pass as ?before for the next (older)
          page.
        example: "2026-09-06T17:40:00Z"
        format: date-time
        type: string
      per_page:
        description: PerPage is the requested page size.
        example: 50
        type: integer
      unread:
        description: Unread is the number of unread messages the caller has in this
          thread.
        example: 2
        type: integer
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_httpx_dto.ErrorBody'
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.Message:
    properties:
      delivered_at:
        example: "2026-09-06T18:05:04Z"
        format: date-time
        type: string
      driver_id:
        example: 1f9d7c2a-4c66-4c2f-9d2f-9a0b7d1e2f34
        type: string
      file_key:
        example: chat/2026/09/6f1a1a5e.pdf
        type: string
      id:
        example: 6f1a1a5e-1b4a-4d0d-9f2e-1c2b3a4d5e6f
        type: string
      kind:
        enum:
        - text
        - image
        - file
        - location
        example: text
        type: string
      lat:
        example: 31.5204
        type: number
      lng:
        example: 74.3587
        type: number
      read_at:
        example: "2026-09-06T18:07:11Z"
        format: date-time
        type: string
      sender_id:
        example: 3a2b1c0d-9e8f-4a5b-8c7d-6e5f4a3b2c1d
        type: string
      sender_side:
        enum:
        - driver
        - office
        example: office
        type: string
      sent_at:
        example: "2026-09-06T18:05:00Z"
        format: date-time
        type: string
      status:
        enum:
        - sent
        - delivered
        - read
        example: delivered
        type: string
      text:
        example: Please head to dock 4 after your break.
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.MessageCreate:
    properties:
      file_key:
        description: |-
          FileKey is the storage key returned by POST /files/presign; required for
          image and file messages.
        example: chat/2026/09/6f1a1a5e.pdf
        maxLength: 512
        type: string
      kind:
        enum:
        - text
        - image
        - file
        - location
        example: text
        type: string
      lat:
        description: Lat and Lng are required for a location message.
        example: 31.5204
        maximum: 90
        minimum: -90
        type: number
      lng:
        example: 74.3587
        maximum: 180
        minimum: -180
        type: number
      text:
        description: Text is required for a text message and optional as a caption
          otherwise.
        example: Please head to dock 4 after your break.
        maxLength: 2000
        type: string
    required:
    - kind
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.MessageEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_chat_dto.Message'
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.MessageListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_chat_dto.Message'
        type: array
      meta:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_chat_dto.CursorMeta'
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.Meta:
    properties:
      page:
        example: 1
        type: integer
      per_page:
        example: 25
        type: integer
      total:
        example: 123
        type: integer
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.ReadResult:
    properties:
      unread:
        example: 0
        type: integer
      updated:
        example: 1
        type: integer
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.ReadResultEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_chat_dto.ReadResult'
    type: object
  github_com_devline_onebook-eld_internal_domain_chat_dto.Thread:
    properties:
      driver_id:
        example: 1f9d7c2a-4c66-4c2f-9d2f-9a0b7d1e2f34
        type: string
      driver_name:
        example: John Doe
        type: string
      driver_status:
        enum:
        - active
        - inactive
        example: active
        type: string
      last_message:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_chat_dto.Message'
      unread_count:
        example: 3
        type: integer
    type: object
