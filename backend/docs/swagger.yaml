  github_com_devline_onebook-eld_internal_domain_tracking_dto.TripDetail:
    properties:
      distance_m:
        description: DistanceM is metres; DurationSec is seconds; MaxSpeedKmh is km/h.
        example: 152300
        type: integer
      driver:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_tracking_dto.DriverBrief'
      duration_sec:
        example: 9120
        type: integer
      end_at:
        example: "2026-09-06T07:44:00Z"
        format: date-time
        type: string
      end_lat:
        example: 31.98
        type: number
      end_lng:
        example: 74.91
        type: number
      id:
        example: 1d2c3b4a-5e6f-4708-8192-a3b4c5d6e7f8
