  github_com_devline_onebook-eld_internal_domain_sync_dto.DvirPush:
    properties:
      client_id:
        description: ClientID is the device generated idempotency key of the report.
        example: 44444444-4444-4444-8444-444444444444
        type: string
    required:
    - client_id
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.ElementResult:
    properties:
      client_event_id:
        description: ClientEventID echoes the element's idempotency key.
        example: 11111111-1111-4111-8111-111111111111
        type: string
      field:
        description: Field names the offending field of an invalid_payload rejection.
        example: event_time
        type: string
      reason:
        description: |-
          Reason explains a rejection, and annotates an accepted event that the
          server changed or that lost conflict rule 1.
        enum:
        - time_in_future
        - time_out_of_range
        - log_locked
        - invalid_payload
        - superseded
        - pc_not_allowed
        - ym_not_allowed
        - sleeper_berth_unavailable
        - drive_not_manual
        - auto_drive
        - yard_move_ended
        example: time_in_future
        type: string
      result:
        enum:
        - accepted
        - duplicate
        - rejected
        example: accepted
        type: string
      superseded_by:
        description: |-
          SupersededBy is the client_event_id that won conflict rule 1. The losing
          event is still stored, flagged, and shown to the driver as a warning.
        example: 22222222-2222-4222-8222-222222222222
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_httpx_dto.ErrorBody'
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.EventPush:
    properties:
      client_event_id:
        description: |-
          ClientEventID is the device generated idempotency key. Re-uploading it
          answers `duplicate`, never an error.
        example: 11111111-1111-4111-8111-111111111111
        type: string
      device_seq:
        description: |-
          DeviceSeq is the monotonic device counter; retries preserve its order
          and it breaks a conflict tie between two devices (rule 1).
        example: 1042
        minimum: 0
        type: integer
      eld_device_id:
        example: 9c3f2f1e-2b4a-4f7d-9a1e-0f2b3c4d5e6f
        type: string
      engine_hours:
        example: 1234.5
        minimum: 0
        type: number
      event_time:
        example: "2026-09-06T05:12:00Z"
        format: date-time
        type: string
      event_type:
        enum:
        - status_change
        - duty_status
        - intermediate
        - login
        - logout
        - power_on
        - power_off
        - engine_on
        - engine_off
        - malfunction
        - diagnostic
        - certification
        - yard_moves
        - personal_use
        example: status_change
        type: string
      gps_accuracy_m:
        example: 12
        minimum: 0
        type: integer
      lat:
        example: 31.52
        maximum: 90
        minimum: -90
        type: number
      lng:
        example: 74.35
        maximum: 180
        minimum: -180
        type: number
      location_text:
        example: 12 km NE of Lahore
        maxLength: 120
        type: string
      notes:
        example: Pickup
        maxLength: 60
        type: string
      odometer_m:
        example: 128430000
        minimum: 0
        type: integer
      origin:
        description: |-
          Origin records how the event came to be. `manual_no_eld` marks a status
          entered with the ELD disconnected (Q7.1). `driver_edit`, `admin_edit`
          and `assigned` are server side origins (log edit approval, §10.4 hand
          over) and are refused here with `rejected(invalid_payload)`.
        enum:
        - auto
        - driver
        - manual_no_eld
        example: driver
        type: string
      shipping_doc_ids:
        example:
        - 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        items:
          type: string
        type: array
      special:
        enum:
        - none
        - pc
        - ym
        example: none
        type: string
      speed_kmh:
        description: |-
          SpeedKmh at event_time drives the server side auto-DR and yard-move exit
          checks (Q5, Q4.2).
        example: 62.5
        maximum: 400
        minimum: 0
        type: number
      status:
        enum:
        - "OFF"
        - SB
        - DR
        - "ON"
        example: "ON"
        type: string
      time_source:
        description: TimeSource is the clock event_time came from (Q-B1.2).
        enum:
        - eld_rtc
        - server
        - phone
        example: eld_rtc
        type: string
      trailer_ids:
        example:
        - 9f8e7d6c-5b4a-4392-8281-706f5e4d3c2b
        items:
          type: string
        type: array
      unit_id:
        example: 6f1a1a5e-1b4a-4d0d-9f2e-1c2b3a4d5e6f
        type: string
    required:
    - client_event_id
    - event_time
    - event_type
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.HosPolicy:
    properties:
      adverse_conditions_extension_min:
        example: 120
        type: integer
      allow_pc:
        example: true
        type: boolean
      allow_ym:
        example: true
        type: boolean
      break_duration_min:
        example: 30
        type: integer
      break_qualifying_statuses:
        example:
        - "OFF"
        - SB
        - "ON"
        items:
          enum:
          - "OFF"
          - SB
          - DR
          - "ON"
          type: string
        type: array
      break_required_after_drive_min:
        example: 480
        type: integer
      cycle_days:
        example: 8
        type: integer
      cycle_limit_min:
        example: 4200
        type: integer
      cycle_restart_min:
        description: CycleRestartMin is null when the policy has no restart provision.
        example: 2040
        type: integer
      daily_rest_min:
        example: 600
        type: integer
      drive_limit_min:
        example: 660
        type: integer
      effective_from:
        example: "2026-01-01T00:00:00Z"
        format: date-time
        type: string
      motion_threshold_kmh:
        example: 8
        type: number
      shift_window_min:
        example: 840
        type: integer
      short_haul_exception:
        example: false
        type: boolean
      sleeper_split_enabled:
        example: true
        type: boolean
      version_id:
        description: |-
          VersionID is the hos_policy_versions row; null means the built-in
          FMCSA 70/8 defaults.
        example: 2f3a4b5c-6d7e-4f80-9a1b-2c3d4e5f6a7b
        type: string
      warn_break_min:
        example: 30
        type: integer
      warn_cycle_min:
        example: 120
        type: integer
      warn_drive_min:
        example: 30
        type: integer
      warn_shift_min:
        example: 60
        type: integer
      ym_max_speed_kmh:
        example: 32
        type: number
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.LogEditRequest:
    properties:
      changes:
        description: Changes are the proposed duty status intervals; `note` is always
          set.
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.LogEditChange'
        type: array
      created_at:
        example: "2026-09-05T09:00:00Z"
        format: date-time
        type: string
      daily_log_id:
        example: 4b5c6d7e-8f90-41a2-b3c4-d5e6f7a8b9c0
        type: string
      id:
        example: 7b8c9d0e-1f2a-4b3c-8d4e-5f6a7b8c9d0e
        type: string
      log_date:
        description: LogDate is the home terminal calendar day the proposal touches
          (Q10.2).
        example: "2026-09-05"
        format: date
        type: string
      source:
        enum:
        - admin_edit
        - unidentified_assign
        example: admin_edit
        type: string
      status:
        enum:
        - pending
        - approved
        - rejected
        example: pending
        type: string
      timezone:
        example: America/Chicago
        type: string
      updated_at:
        example: "2026-09-05T09:00:00Z"
        format: date-time
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.PullEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.PullResponse'
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.PullResponse:
    properties:
      chat:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ChatMessage'
        type: array
      daily_logs:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.DailyLogSummary'
        type: array
      defect_types:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.DefectType'
        type: array
      events:
        description: |-
          Events are the server's canonical copies of changed duty status events
          (rule 2: the server wins, the device rebuilds its local log).
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.DutyStatusEvent'
        type: array
      hos_policy:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.HosPolicy'
      log_edit_requests:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.LogEditRequest'
        type: array
      next_since:
        description: |-
          NextSince is the cursor to send on the next pull. It is the newest
          `updated_at` actually returned, so a truncated page is resumed exactly.
        example: "2026-09-06T05:13:59Z"
        format: date-time
        type: string
      quick_notes:
        example:
        - Pickup
        - Delivery
        - Fuel
        items:
          type: string
        type: array
      server_time:
        example: "2026-09-06T05:14:11Z"
        format: date-time
        type: string
      truncated:
        description: |-
          Truncated is true when a list hit its ceiling: pull again immediately
          with next_since.
        example: false
        type: boolean
      unidentified_events:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.UnidentifiedEvent'
        type: array
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.PushEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.PushResponse'
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.PushRequest:
    properties:
      app_version:
        example: 1.2.0
        maxLength: 32
        type: string
      chat:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ChatPush'
        type: array
      clock:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.Clock'
      device_id:
        description: |-
          DeviceID identifies the uploading phone; it namespaces the per device
          rate limit and is echoed into the audit trail.
        example: a1b2c3d4-e5f6-4718-9a0b-1c2d3e4f5a6b
        maxLength: 128
        type: string
      dvir:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.DvirPush'
        type: array
      events:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.EventPush'
        type: array
      telemetry:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.TelemetryPoint'
        type: array
      unit_id:
        description: |-
          UnitID is the unit the telemetry belongs to; required when `telemetry`
          is not empty.
        example: 6f1a1a5e-1b4a-4d0d-9f2e-1c2b3a4d5e6f
        type: string
    required:
    - device_id
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.PushResponse:
    properties:
      chat:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ElementResult'
        type: array
      clock:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ClockVerdict'
      dvir:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ElementResult'
        type: array
      events:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ElementResult'
        type: array
      server_time:
        example: "2026-09-06T05:14:11Z"
        format: date-time
        type: string
      telemetry:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.TelemetryResult'
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.TelemetryPoint:
    properties:
      battery_pct:
        example: 87
        maximum: 100
        minimum: 0
        type: number
      battery_voltage_v:
        example: 13.8
        maximum: 60
        minimum: 0
        type: number
      coolant_level_pct:
