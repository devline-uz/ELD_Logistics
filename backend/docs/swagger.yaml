        type: string
      unit_number:
        example: "1021"
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_tracking_dto.TripEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_tracking_dto.TripDetail'
    type: object
  github_com_devline_onebook-eld_internal_domain_tracking_dto.TripListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_tracking_dto.Trip'
        type: array
      meta:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_tracking_dto.Meta'
    type: object
  github_com_devline_onebook-eld_internal_domain_tracking_dto.UnidentifiedEvent:
    properties:
      annotation:
        example: Workshop test drive
        type: string
      assigned_driver_id:
        description: |-
          AssignedDriverID is set once an admin assignment or a driver claim
          resolved the event.
        example: 3b0e1f2a-5c6d-4e7f-8a9b-0c1d2e3f4a5b
        type: string
      created_at:
        example: "2026-09-06T05:31:04Z"
        format: date-time
        type: string
      distance_m:
        description: DistanceM is metres driven without an identified driver.
        example: 8400
        type: integer
      end_at:
        example: "2026-09-06T05:31:00Z"
        format: date-time
        type: string
      id:
        example: 7c8d9e0f-1a2b-4c3d-8e4f-5a6b7c8d9e0f
        type: string
      pending_days:
        description: |-
          PendingDays is how long the event has been unresolved; beyond 8 days it
          raises an admin alert (TZ A§10.4).
        example: 3
        type: integer
      resolved_at:
        example: "2026-09-08T09:00:00Z"
        format: date-time
        type: string
      start_at:
        example: "2026-09-06T05:12:00Z"
        format: date-time
        type: string
      status:
        enum:
        - pending
        - assigned
        - annotated
        example: pending
        type: string
      track_key:
        description: TrackKey is the object storage key of the recorded track.
        example: 6f1a1a5e/unidentified/2026/09/2b7c4d1a.polyline
        type: string
      unit_id:
        example: 6f1a1a5e-1b4a-4d0d-9f2e-1c2b3a4d5e6f
        type: string
      unit_number:
        example: "1021"
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_tracking_dto.UnidentifiedEventListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_tracking_dto.UnidentifiedEvent'
        type: array
      meta:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_tracking_dto.Meta'
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_httpx_dto.ErrorBody'
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.InvitationEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.InvitationSent'
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.InvitationSent:
    properties:
      channel:
        enum:
        - email
        - sms
        - telegram
        example: email
        type: string
      expires_at:
        example: "2026-09-04T10:00:00Z"
        format: date-time
        type: string
      purpose:
        enum:
        - invitation
        - password_reset
        example: invitation
        type: string
      user_id:
        example: 6f1a1a5e-1b4a-4d0d-9f2e-1c2b3a4d5e6f
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.Meta:
    properties:
      page:
        example: 1
        type: integer
      per_page:
        example: 25
        type: integer
      total:
        example: 123
        type: integer
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.Permission:
    properties:
      description:
        example: View units
        type: string
      key:
        example: units.read
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.PermissionListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.PermissionModule'
        type: array
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.PermissionModule:
    properties:
      label:
        example: Units
        type: string
      module:
        example: units
        type: string
      permissions:
        description: Permissions are ordered exactly like the catalogue.
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.Permission'
        type: array
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.Role:
    properties:
      created_at:
        example: "2026-09-01T10:00:00Z"
        format: date-time
        type: string
      description:
        example: Fleet and driver management
        type: string
      id:
        example: 9d1b7f3e-4c2a-4a1b-9e7d-2f5a6b8c0d1e
        type: string
      is_system:
        description: IsSystem roles (Super Admin, Administrator, ...) cannot be edited.
        example: false
        type: boolean
      name:
        example: Fleet Manager
        type: string
      permissions:
        example:
        - units.read
        - units.create
        items:
          type: string
        type: array
      scope:
        description: Scope decides how far a holder of the role can see (TZ Q82.1).
        enum:
        - company
        - branch
        - self
        example: company
        type: string
      updated_at:
        example: "2026-09-05T17:42:00Z"
        format: date-time
        type: string
      user_count:
        example: 7
        type: integer
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.RoleCreate:
    properties:
      description:
        example: Yard operations only
        maxLength: 255
        type: string
      name:
        example: Yard Supervisor
        maxLength: 64
        minLength: 2
        type: string
      permissions:
        description: Permissions must be keys of GET /permissions; unknown keys are
          rejected.
        example:
        - units.read
        - drivers.read
        items:
          type: string
        minItems: 1
        type: array
      scope:
        description: Scope is company or branch; `self` is reserved for the built
          in Driver role.
        enum:
        - company
        - branch
        example: company
        type: string
    required:
    - name
    - permissions
    - scope
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.RoleEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.Role'
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.RoleListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.Role'
        type: array
      meta:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.Meta'
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.RoleUpdate:
    properties:
      description:
        example: Yard operations only
        maxLength: 255
        type: string
      name:
        example: Yard Supervisor
        maxLength: 64
        minLength: 2
        type: string
      permissions:
        description: Permissions replaces the whole set when present.
        example:
        - units.read
        - drivers.read
        items:
          type: string
        type: array
      scope:
        enum:
        - company
        - branch
        example: branch
        type: string
    required:
    - permissions
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.User:
    properties:
      activated_at:
        example: "2026-09-02T08:15:00Z"
        format: date-time
        type: string
      branch_id:
        example: 2b7c9d1e-3f4a-4b5c-8d9e-0f1a2b3c4d5e
        type: string
      branch_name:
        example: Chicago
        type: string
      created_at:
        example: "2026-09-01T10:00:00Z"
        format: date-time
        type: string
      email:
        example: john.doe@example.com
        type: string
      first_name:
        example: John
        type: string
      full_name:
        example: John Doe
        type: string
      id:
        example: 6f1a1a5e-1b4a-4d0d-9f2e-1c2b3a4d5e6f
        type: string
      invited_at:
        example: "2026-09-01T10:00:00Z"
        format: date-time
        type: string
      last_login_at:
        example: "2026-09-05T17:42:00Z"
        format: date-time
        type: string
      last_name:
        example: Doe
        type: string
      phone:
        example: "+13125550142"
        type: string
      role:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.UserRole'
      status:
        description: 'Status follows TZ Q1: invited -> active, active <-> inactive.'
        enum:
        - invited
        - active
        - inactive
        example: active
        type: string
      totp_enabled:
        example: false
        type: boolean
      updated_at:
        example: "2026-09-05T17:42:00Z"
        format: date-time
        type: string
      username:
        example: jdoe
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.UserCreate:
    properties:
      branch_id:
        description: BranchID is required for a branch scoped role.
        example: 2b7c9d1e-3f4a-4b5c-8d9e-0f1a2b3c4d5e
        type: string
      channel:
        description: |-
          Channel selects how the invitation is delivered; empty picks email when
          an address is present, otherwise sms.
        enum:
        - email
        - sms
        - telegram
        example: email
        type: string
      email:
        description: 'Email or Phone is required: it is the channel the invitation
          is sent on.'
        example: john.doe@example.com
        maxLength: 254
        type: string
      first_name:
        example: John
        maxLength: 64
        type: string
      last_name:
        example: Doe
        maxLength: 64
        type: string
      phone:
        example: "+13125550142"
        maxLength: 32
        type: string
      role_id:
        example: 9d1b7f3e-4c2a-4a1b-9e7d-2f5a6b8c0d1e
        type: string
      username:
        description: Username must be unique inside the company.
        example: jdoe
        maxLength: 64
        minLength: 3
        type: string
    required:
    - first_name
    - last_name
    - role_id
    - username
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.UserEnvelope:
    properties:
      data:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.User'
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.UserListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.User'
        type: array
      meta:
        $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_users_dto.Meta'
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.UserRole:
    properties:
      id:
        example: 9d1b7f3e-4c2a-4a1b-9e7d-2f5a6b8c0d1e
        type: string
      is_system:
        example: false
        type: boolean
      name:
        example: Fleet Manager
        type: string
      scope:
        enum:
        - company
        - branch
        - self
        example: company
        type: string
    type: object
  github_com_devline_onebook-eld_internal_domain_users_dto.UserUpdate:
    properties:
      branch_id:
        description: BranchID accepts an explicit null to detach the user from its
          branch.
        example: 2b7c9d1e-3f4a-4b5c-8d9e-0f1a2b3c4d5e
        type: string
      email:
        example: john.doe@example.com
        maxLength: 254
        type: string
      first_name:
        example: John
        maxLength: 64
        minLength: 1
        type: string
      last_name:
        example: Doe
        maxLength: 64
        minLength: 1
        type: string
      phone:
        example: "+13125550142"
        maxLength: 32
        type: string
      role_id:
        example: 9d1b7f3e-4c2a-4a1b-9e7d-2f5a6b8c0d1e
        type: string
      username:
        example: jdoe
        maxLength: 64
        minLength: 3
        type: string
    type: object
  github_com_devline_onebook-eld_internal_httpx_dto.ErrorBody:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      details:
        items:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_httpx_dto.FieldError'
        type: array
      message:
        example: validation failed
        type: string
    type: object
  github_com_devline_onebook-eld_internal_httpx_dto.FieldError:
    properties:
      field:
        example: unit_number
        type: string
      message:
        example: required
        type: string
    type: object
  github_com_devline_onebook-eld_internal_httpx_dto.MessageResponse:
    properties:
      message:
        example: ok
        type: string
    type: object
info:
  contact:
    email: api@onebook-eld.com
    name: ONEBOOK ELD Platform Team
  description: Multi-tenant ELD / fleet management API. Every endpoint below /api/v1
    requires a bearer access token unless it is marked `@x-permission public`.
  license:
    name: Proprietary
  termsOfService: https://onebook-eld.com/terms
  title: ONEBOOK ELD API
  version: "1.0"
paths:
  /app/config:
    get:
      description: 'Versioning gate for the mobile client: `min_supported_version`,
        `latest_version`, `force_update` and the deployment feature flags. Public,
        but rate limited to 60 requests per minute per address and served from a 45
        second cache.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.AppConfigEnvelope'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
      summary: Client bootstrap configuration
      tags:
      - app
      x-permission: public
  /audit-log:
    get:
      description: 'TZ A§17 — the single audit trail; the four journals of the UI
        are filtered views of this endpoint. Newest first by default. `old_value`
        and `new_value` are masked: a password hash, session token, encrypted column
        or driver licence number is returned as `[REDACTED]` and `masked` is true.
        The table is append-only, so there is no create, update or delete route.'
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 25
        description: Rows per page (10/25/50, max 100)
        in: query
        name: per_page
        type: integer
      - default: desc
        description: Timestamp order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Audited table name
        example: support_tickets
        in: query
        name: table
        type: string
      - description: Audited row id (uuid)
        in: query
        name: record_id
        type: string
      - description: Acting user id (uuid), matches audit_log.edited_by
        in: query
        name: user
        type: string
      - description: Audited action
        example: update
        in: query
        name: action
        type: string
      - description: Timestamp at or after (RFC3339)
        in: query
        name: from
        type: string
      - description: Timestamp before (RFC3339)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.EntryListEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.ErrorResponse'
        "422":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit log entries
      tags:
      - audit
      x-permission: audit.view
  /audit-log/tables:
    get:
      description: Distinct `audit_log.table_name` values of the company, for the
        filter dropdown of the audit journal screen.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.TableListEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auditlog_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audited table names
      tags:
      - audit
      x-permission: audit.view
  /auth/2fa/setup:
    post:
      description: Q3.4 — mandatory for Super Admin and Administrator. The shared
        secret is stored AES-256-GCM encrypted and is only enabled once POST /auth/2fa/verify
        succeeds.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPSetupEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "409":
          description: TOTP_ALREADY_ENABLED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start two factor enrolment
      tags:
      - auth
      x-permission: authenticated
  /auth/2fa/verify:
    post:
      consumes:
      - application/json
      description: Q3.4 — confirming an enrolment returns the ten single use recovery
        codes exactly once and upgrades a limited token into a full session.
      parameters:
      - description: TOTP or recovery code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.TOTPVerifiedEnvelope'
        "401":
          description: UNAUTHORIZED / TOTP_INVALID
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "403":
          description: TOTP_SETUP_REQUIRED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "422":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm a two factor code
      tags:
      - auth
      x-permission: authenticated
  /auth/invitation/accept:
    post:
      consumes:
      - application/json
      description: Q16 — the link is valid for 72 hours and only its SHA-256 hash
        is stored. Setting the password revokes every existing session of the account.
      parameters:
      - description: Invitation token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.InvitationAcceptRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: INVITATION_INVALID / INVITATION_EXPIRED / INVITATION_USED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "403":
          description: ACCOUNT_INACTIVE
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "422":
          description: VALIDATION_ERROR / PASSWORD_WEAK / PIN_INVALID
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
      summary: Accept an invitation
      tags:
      - auth
      x-permission: public
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Q20 — one session per device_type: signing in on the same device
        type revokes the previous session and answers `replaced_session: true`. Super
        Admin and Administrator accounts without 2FA receive a limited token and `requires_totp_setup:
        true`.'
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.LoginEnvelope'
        "400":
          description: BAD_REQUEST
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "401":
          description: INVALID_CREDENTIALS / TOTP_REQUIRED / TOTP_INVALID
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "403":
          description: ACCOUNT_INACTIVE / SUBSCRIPTION_EXPIRED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "422":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED / LOCKED_OUT
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_auth_dto.ErrorResponse'
      summary: Sign in
      tags:
      - auth
      x-permission: public
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 'Q3.1 — `pause: true` is Leave Truck: the session becomes `paused`
        and is resumed with POST /auth/pin/verify.'
      parameters:
      - description: Logout options
        in: body
        name: body
        schema:
