          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.LogEditRequestEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "409":
          description: INVALID_STATE / DR_IMMUTABLE / EVENT_IMMUTABLE
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
      security:
