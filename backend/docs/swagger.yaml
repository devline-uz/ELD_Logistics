      last_service_value:
        description: LastServiceValue is the reading at the last completed service.
        example: 103430
        type: number
      next_due_at:
        example: "2026-11-01T00:00:00Z"
        format: date-time
        type: string
      next_due_value:
        description: NextDueValue is last_service_value + interval_value.
        example: 128430
