          description: BAD_REQUEST
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_dvir_dto.ErrorResponse'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_dvir_dto.ErrorResponse'
        "403":
          description: DVIR_ADMIN_CREATE_DENIED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_dvir_dto.ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_dvir_dto.ErrorResponse'
        "409":
          description: DVIR_INVALID_TRANSITION
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_dvir_dto.ErrorResponse'
        "422":
          description: VALIDATION_ERROR / DEFECT_TYPE_UNKNOWN
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_dvir_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_dvir_dto.ErrorResponse'
