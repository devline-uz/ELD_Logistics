        maximum: 100
        minimum: 0
        type: number
      coolant_temp_c:
        example: 88
        type: number
      diagnostics:
        description: |-
          Diagnostics are the FMCSA Appendix A letters active at TS (TZ §10.5).
          Send an empty array to clear the stored codes; omit the field to leave
          them untouched.
        example:
        - T
        - L
        items:
          type: string
        type: array
      disconnected:
        description: |-
          Disconnected marks the sample the ELD sends when it loses the link to the
          phone (TZ §10.1 "Disconnected").
        example: false
        type: boolean
      driver_id:
        description: |-
          DriverID is null for unidentified driving (TZ A§10.4); the sample then
          opens or extends an unidentified_events buffer entry.
        example: 3b0e1f2a-5c6d-4e7f-8a9b-0c1d2e3f4a5b
        type: string
      duty_status:
        description: DutyStatus is the duty status in force at TS, when known.
        enum:
        - "OFF"
        - SB
        - DR
        - "ON"
        example: DR
        type: string
      engine_hours:
        description: EngineHours is the ECM total engine time in hours.
        example: 1234.5
        minimum: 0
        type: number
      fuel_pct:
        example: 74
        maximum: 100
        minimum: 0
        type: number
      heading_deg:
        example: 180
        minimum: 0
        type: number
      ignition:
        example: true
        type: boolean
      lat:
        example: 31.52
        maximum: 90
        minimum: -90
        type: number
      lng:
        example: 74.35
        maximum: 180
        minimum: -180
        type: number
      odometer_m:
        description: OdometerM is the ECM total distance in metres.
        example: 128430000
        minimum: 0
        type: integer
      oil_level_pct:
        example: 60
        maximum: 100
        minimum: 0
        type: number
      speed_kmh:
        example: 62.5
        maximum: 400
        minimum: 0
        type: number
      ts:
        example: "2026-09-06T05:12:00Z"
        format: date-time
        type: string
    required:
    - ts
    type: object
  github_com_devline_onebook-eld_internal_domain_sync_dto.TelemetryResult:
    properties:
      accepted:
        example: 120
        type: integer
      distance_m:
