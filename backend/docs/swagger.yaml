        - xlsx
        - pdf
        - zip
        example: xlsx
        type: string
      params:
        allOf:
        - $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_reports_dto.ExportParams'
        description: Params carries the report specific window and filters.
      type:
        description: Type is the report to render.
        enum:
        - distance_by_region
        - regulator
        - activity
        - hos
        - dvir
        example: distance_by_region
        type: string
