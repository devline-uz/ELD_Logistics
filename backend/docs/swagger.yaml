  /violations:
    get:
      description: 'Q57/Q58 — the canonical violation history. Violations are created
        on the server only (the mobile app previews them) and are **never deleted**:
        a closed one keeps `resolved_at` and `resolved_reason` and stays in the list.
        Q59: the filters are independent of each other. Closing rules: `break_required`
        after a qualifying break, `drive_limit`/`shift_limit` after a daily rest,
        `cycle_limit` after a restart or when the day drops out of the cycle window,
        `form_manner_*` when the field is filled in and the log is certified again,
        `uncertified_log` on signature and `unidentified_driving` on assignment.'
      parameters:
      - description: Driver filter (uuid)
        in: query
        name: driver_id
        type: string
      - description: Violation type
        enum:
        - form_manner_trailer
        - form_manner_doc
        - drive_limit
        - shift_limit
        - break_required
        - cycle_limit
        - uncertified_log
        - unidentified_driving
        - eld_malfunction
        - missing_dvir
        in: query
        name: type
        type: string
      - description: Severity
        enum:
        - warning
        - violation
        in: query
        name: severity
        type: string
      - description: Only resolved (true) or only open (false)
        in: query
        name: resolved
        type: boolean
      - description: Occurred from, RFC3339
        in: query
        name: from
        type: string
      - description: Occurred before, RFC3339
        in: query
        name: to
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 25
        description: Rows per page (10/25/50, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ViolationListEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "422":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List violations
      tags:
      - violations
      x-permission: violations.read
  /violations/{id}:
    get:
      description: Q57 — one stored violation with the policy version it was judged
        under (Q10.1) and, once closed, its `resolved_reason` (Q58). The row is never
        removed.
      parameters:
      - description: Violation id (uuid)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
