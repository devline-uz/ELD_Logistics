  /maintenance-schedule-units/{id}/complete:
    post:
      consumes:
      - application/json
      description: 'TZ §8 Q41–Q43 — records Invoice #, Vendor, Cost, Date and the
        invoice file, and writes a `completed` row into `/maintenance-records`. Q42.1:
        `last_service_value` is set to the odometer / engine hours read **at this
