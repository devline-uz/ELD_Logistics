      summary: Propose a log edit
      tags:
      - log-edits
      x-permission: logs.propose_edit
  /log-edit-requests/{id}/approve:
    post:
      description: Q17 — only the driver whose log is being changed may approve. The
        new events are written with `origin=admin_edit`, the original events are kept
        and flagged with `superseded_by` (nothing is deleted) and a certified day
        falls back to `needs_recertify` (Q18). For an `unidentified_assign` request
        the stored driving rows are handed over with `origin=assigned` (§10.4) and
        the 8 day `unidentified_driving` violation is closed.
