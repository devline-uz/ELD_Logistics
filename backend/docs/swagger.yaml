  /users/{id}/resend-invitation:
    post:
      description: A§16 — a fresh 72 hour link is issued and the previous one is invalidated.
        The token itself is delivered out of band and never appears in the response.
      parameters:
      - description: User id
        format: uuid
        in: path
        name: id
        required: true
