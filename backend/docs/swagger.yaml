      description: TZ B§3.4 — the API never proxies bytes. `kind` is a closed whitelist
        (dvir_photo, invoice, signature, logo, chat, import); the content type and
        the size are checked against the per-kind ceiling (DVIR photo ≤ 5 MiB, invoice
        ≤ 10 MiB) before anything is signed. The object key is derived server side
        from the tenant, the kind and a random uuid — a client supplied path is never
        trusted — and only that key is stored. The URL is a PUT valid for 15 minutes;
        its `Content-Type` **and** `Content-Length` headers are part of the signature,
        so the upload must be exactly `size_bytes` long — the ceiling cannot be bypassed
        after presigning. Send every header of `headers` verbatim.
