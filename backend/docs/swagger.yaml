  /dashboard/summary:
    get:
      description: 'TZ A§20 — the KPI cards, the current duty status block and today''s
        routes. Every window is cut on the company timezone: `active_units` counts
        the units that reported telemetry today, `drivers_on_duty` the drivers currently
        in ON or DR, `violations` the violations of the current ISO week (Monday–Sunday),
