  /daily-logs/{id}/certify:
    post:
      consumes:
      - application/json
      description: 'Q26.1 — the driver signs the day: `signed_at`, the signature key,
        `signed_ip` and `signed_device_id` are stored, a `certification` event is
        written and the day''s events become `locked` (only an approved edit request
        may move them afterwards). Q26: an administrator never certifies on the driver''s
        behalf, so a caller that is not the owning driver is refused with 403. The
        signature is taken from `signature_key`, from `signature_id` (a stored signature
        of the same user) or from the driver''s default; without any of them the day
        is `LOG_NOT_READY` (Q25).'
