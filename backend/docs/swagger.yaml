  github_com_devline_onebook-eld_internal_domain_sync_dto.ClockVerdict:
    properties:
      clock_skew_sec:
        description: SkewSec is phone minus reference clock, in seconds.
        example: 0
        type: integer
      malfunction_code:
        description: |-
