  /sync/pull:
    get:
      description: 'TZ D§2 — everything the device has to catch up on since `since`:
        pending log edit requests, the unidentified driving buffer of the driver''s
        unit (A§10.4), the server''s canonical copies of changed duty status events
        and log days (conflict rule 2 — the server wins and the device rebuilds its
        local log), the current `hos_policy`, the DVIR defect catalogue, the quick-note
        templates and new chat messages. `next_since` is the newest `updated_at` actually
        returned, so a truncated page (`truncated=true`) resumes exactly where it
        stopped. Without `since` the default window is the last 8 days. A Driver reads
        its own data only.'
      parameters:
      - description: Cursor from the previous pull, RFC3339
        in: query
        name: since
        type: string
      - description: Unit the driver is logged into; selects the unidentified driving
          buffer
        in: query
        name: unit_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.PullEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
        "403":
          description: FORBIDDEN — the caller is not a driver
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
        "422":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Download server changes
      tags:
      - sync
      x-permission: logs.read
  /sync/push:
    post:
      consumes:
      - application/json
      description: 'TZ D§2 — the driver app drains its offline queue here. Each element
        is answered individually with `accepted`, `duplicate` or `rejected(reason)`;
        a duplicate `client_event_id` is never an error. Conflict rules: an event
        more than five minutes ahead of the server is `rejected(time_in_future)`;
        an event on a certified day is `rejected(log_locked)`; two devices claiming
        the same instant are resolved by `time_source` priority (eld_rtc > server
        > phone) then by the larger `device_seq`, and the loser is still stored with
        `superseded_by` set and reported as `accepted` with `reason=superseded`. The
        server also enforces the duty rules it owns: PC/YM need `hos_policy.allow_pc`/`allow_ym`,
        SB needs a sleeper berth on the unit, DR is never selected by hand, and motion
        at or above `motion_threshold_kmh` coerces the status to DR. Ceilings: 500
        events, 5000 telemetry points, 100 DVIR, 500 chat. `Idempotency-Key` is required.
        DVIR and chat elements are acknowledged but only processed from stages 5-6
        on.'
      parameters:
      - description: Idempotency key; a repeat replays the recorded response for 24h
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Offline batch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.PushRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.PushEnvelope'
        "400":
          description: BAD_REQUEST — Idempotency-Key missing
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
        "403":
          description: FORBIDDEN — the caller is not a driver
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
        "409":
          description: IDEMPOTENCY_CONFLICT
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
        "422":
          description: VALIDATION_ERROR, BATCH_TOO_LARGE
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_sync_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload an offline batch
      tags:
      - sync
      x-permission: logs.read
  /tracking/live:
    get:
      description: TZ §10.1 / Q63 — the last known state of every unit, read from
        `unit_last_state`. `online_status` is Online (telemetry within 5 minutes),
        Offline, Disconnected (the ELD reported losing the phone link) or Malfunction
        (the wired ELD carries an active FMCSA Appendix A code, which wins over the
        connectivity state). A branch scoped principal always sees its own branch
        only. Distances are metres and speeds km/h; the backend never converts units.
        The `online_status` filter matches the stored connectivity state, so `malfunction`
        is not a filter value.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 25
        description: Rows per page (10/25/50, max 100)
        in: query
        name: per_page
        type: integer
      - description: Comma separated unit ids (max 500)
        in: query
        name: unit_ids
        type: string
      - description: Branch filter (uuid)
        in: query
        name: branch_id
        type: string
      - description: Connectivity filter
        enum:
        - online
        - idle
        - offline
        - disconnected
        in: query
        name: online_status
        type: string
      - description: Include inactive units
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_tracking_dto.LiveUnitListEnvelope'
        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_tracking_dto.ErrorResponse'
