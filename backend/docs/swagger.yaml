        last_name, username, phone, email, license_no, license_region, home_terminal).
        Validation is row by row and **all-or-nothing**: one critical error and nothing
        at all is written; the body then lists every `{row, field, message}` and the
        response status is 422. Every imported driver gets a users row (Driver role,
        status `invited`) and an invitation link; `license_no` is stored AES-256-GCM
