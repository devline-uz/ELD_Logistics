        "401":
          description: UNAUTHORIZED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "422":
          description: VALIDATION_ERROR
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_logs_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List log edit requests
      tags:
      - log-edits
      x-permission: logs.read
    post:
      consumes:
      - application/json
      description: 'TZ §5.3 / Q17 [MUST] — an administrator never rewrites a driver
        log directly. The proposal is stored `pending` and the driver approves or
        rejects it. `note` is mandatory on every change. Q17.1 is enforced already
        at proposal time: automatically recorded `DR` may not be shortened or re-classified
        (`DR_IMMUTABLE`), and `intermediate`, `power_on/off` and `malfunction` events
        are never editable (`EVENT_IMMUTABLE`).'
      parameters:
      - description: Proposed changes
        in: body
        name: body
        required: true
