          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_dvir_dto.ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/github_com_devline_onebook-eld_internal_domain_dvir_dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List DVIR reports
      tags:
      - dvir
      x-permission: dvir.read
    post:
      consumes:
      - application/json
      description: 'TZ §7.1 (mobile, driver only). Q31: an administrator never files
        a DVIR on a driver''s behalf, so the caller must own a driver record — anyone
        else gets 403 `DVIR_ADMIN_CREATE_DENIED`. Q28: time, location, odometer and
        engine hours are captured server side from telemetry, so the body carries
        none of them. Q27.1: every defect references the `defect_types` catalogue
        and carries at most five photos. Q27.2: a defect flagged `is_critical` sets
        `units.out_of_service` and raises an immediate alert. The stored status is
        derived, not sent: no defects yields `submitted_no_defects`, any defect yields
        `submitted_defects_found` (the mobile `in_progress` state never reaches the
        server, Q30.2).'
