version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - dupl
    - errcheck
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    dupl:
      threshold: 180
    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (net/http.ResponseWriter).Write
    goconst:
      min-len: 3
      min-occurrences: 4
      # DB column names, JSON field names and validator field labels (status,
      # driver_id, co_driver_id, deleted_at, ...) are legitimately repeated
      # across query builders, sort/filter whitelists and apierr.Details field
      # tags in every domain package — they are not "magic strings" to
      # deduplicate, they are the wire/column vocabulary. MIME types are the
      # same shape. Anything that isn't a plain lower snake_case token (role
      # names, user-facing messages, credentials in tests, ...) still fails.
      ignore-strings: "^[a-z][a-z0-9]*(_[a-z0-9]+)*$|^[a-z]+/[a-z.+-]+$"
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G202
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
      # swag descriptions and DTO struct tags carry long, deliberately
      # detailed human-readable text (enum lists, examples, TZ references);
      # wrapping them would break `swag init` output or the tag string
      # itself. Handled below via exclusions.rules instead of raising the
      # global limit, so a genuinely oversized code line still fails.
      tab-width: 4
    revive:
      rules:
        - name: exported
          disabled: false
        - name: context-as-argument
        - name: error-return
        - name: error-naming
        - name: indent-error-flow
        - name: package-comments
        - name: unreachable-code
        - name: var-naming
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - errcheck
          - funlen
          - gosec
          - lll
          - noctx
          - goconst
        path: _test\.go
        # noctx: httptest.NewRequest (no context) is the standard, blessed way
        # to build a request in a table-driven handler test; the request
        # never leaves the process, so the "use *WithContext, allow
        # cancellation" rationale behind noctx does not apply here.
        # goconst: fixture literals (role names, statuses, sample emails,
        # test passwords) are deliberately repeated for readability across
        # table-driven cases; extracting a constant would not make an
        # *_test.go file easier to read.
      # testutil is test-support code: it fails the test via require/t.Fatal,
      # so the same relaxations as _test.go apply.
      - linters:
          - dupl
          - errcheck
          - funlen
          - gosec
          - lll
          - noctx
          - goconst
        path: internal/testutil/
      - linters:
          - lll
        source: '^\s*//\s*@'
        # swaggo annotation lines (`// @Description ...`, `//	@description
        # ...`) are prose consumed by `swag init`; wrapping them changes the
        # generated Swagger text and buys nothing.
      - linters:
          - lll
        path: (^|/)dto/.*\.go$
        source: 'json:"'
        # DTO struct field lines carry `json`/`example`/`enums`/`validate`
        # struct tags read by swaggo and the validator — the whole point is
        # a complete, self-documenting tag per field (TZ: "har DTO maydonida
        # `example`"). dto/ packages hold nothing but these struct
        # definitions (eld-go-conventions), so the path scope is safe.
      - linters:
          - govet
        text: 'shadow: declaration of "err"'
        # `if err := f(); err != nil { ... }` re-declaring `err` in a nested
        # scope is the idiomatic Go error-handling shape used throughout this
        # codebase (see eld-go-conventions); govet's `shadow` check has no way
        # to special-case it. Shadowing of any other identifier still fails.
      - linters:
          - dupl
          - gocritic
          - lll
          - revive
          - staticcheck
        path: internal/db/.*\.sql\.go
      - linters:
          - lll
          - revive
          - staticcheck
        path: internal/db/models\.go
    paths:
      - docs
      - bin
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/devline/onebook-eld
  exclusions:
    generated: lax
    paths:
      - docs
      - bin
      - third_party$
      - builtin$
      - examples$
