name: onebook-eld

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: onebook-eld-postgres
    environment:
      POSTGRES_USER: eld
      POSTGRES_PASSWORD: eld
      POSTGRES_DB: onebook_eld
      TZ: UTC
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb", "-c", "timezone=UTC"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eld -d onebook_eld"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: onebook-eld-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    container_name: onebook-eld-migrate
    environment:
      DATABASE_URL: postgres://eld:eld@postgres:5432/onebook_eld?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
      args:
        VERSION: ${VERSION:-dev}
    container_name: onebook-eld-api
    environment:
      APP_ENV: local
      HTTP_ADDR: ":8080"
      PUBLIC_BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://eld:eld@postgres:5432/onebook_eld?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-0123456789abc}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-xxxx}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      WS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      # Map provider (TZ B§7.3) — reverse geocoding and trip planner
      # directions. Empty GEO_GEOCODE_URL degrades to the nop provider with a
      # warning, so local runs never depend on an outbound network call.
      GEO_PROVIDER: ${GEO_PROVIDER:-nominatim}
      GEO_GEOCODE_URL: ${GEO_GEOCODE_URL:-}
      GEO_ROUTING_URL: ${GEO_ROUTING_URL:-}
      GEO_API_KEY: ${GEO_API_KEY:-}
      GEO_REGION: ${GEO_REGION:-us}
      # Notification providers are optional: an empty credential disables the
      # channel with a warning, the in-app inbox is always written.
      NOTIFY_SMTP_HOST: ${NOTIFY_SMTP_HOST:-}
      NOTIFY_SMTP_PORT: ${NOTIFY_SMTP_PORT:-587}
      NOTIFY_SMTP_USERNAME: ${NOTIFY_SMTP_USERNAME:-}
      NOTIFY_SMTP_PASSWORD: ${NOTIFY_SMTP_PASSWORD:-}
      NOTIFY_SMTP_FROM: ${NOTIFY_SMTP_FROM:-}
      NOTIFY_FCM_PROJECT_ID: ${NOTIFY_FCM_PROJECT_ID:-}
      NOTIFY_FCM_SERVICE_ACCOUNT_JSON: ${NOTIFY_FCM_SERVICE_ACCOUNT_JSON:-}
      NOTIFY_APNS_AUTH_KEY: ${NOTIFY_APNS_AUTH_KEY:-}
      NOTIFY_APNS_KEY_ID: ${NOTIFY_APNS_KEY_ID:-}
      NOTIFY_APNS_TEAM_ID: ${NOTIFY_APNS_TEAM_ID:-}
      NOTIFY_APNS_TOPIC: ${NOTIFY_APNS_TOPIC:-}
      NOTIFY_SMS_ENDPOINT: ${NOTIFY_SMS_ENDPOINT:-}
      NOTIFY_SMS_TOKEN: ${NOTIFY_SMS_TOKEN:-}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${NOTIFY_TELEGRAM_BOT_TOKEN:-}
      LOG_LEVEL: debug
      REGION: us-east-1
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
      args:
        VERSION: ${VERSION:-dev}
    container_name: onebook-eld-worker
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://eld:eld@postgres:5432/onebook_eld?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-0123456789abc}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-bytes-xxxx}
      # The worker rolls up Distance by Region against the same map provider
      # as the API (TZ §14 reverse geocoding of the telemetry track).
      GEO_PROVIDER: ${GEO_PROVIDER:-nominatim}
      GEO_GEOCODE_URL: ${GEO_GEOCODE_URL:-}
      GEO_ROUTING_URL: ${GEO_ROUTING_URL:-}
      GEO_API_KEY: ${GEO_API_KEY:-}
      GEO_REGION: ${GEO_REGION:-us}
      # The worker sends the cron driven alerts, so it needs the same
      # notification credentials as the API.
      NOTIFY_SMTP_HOST: ${NOTIFY_SMTP_HOST:-}
      NOTIFY_SMTP_PORT: ${NOTIFY_SMTP_PORT:-587}
      NOTIFY_SMTP_USERNAME: ${NOTIFY_SMTP_USERNAME:-}
      NOTIFY_SMTP_PASSWORD: ${NOTIFY_SMTP_PASSWORD:-}
      NOTIFY_SMTP_FROM: ${NOTIFY_SMTP_FROM:-}
      NOTIFY_FCM_PROJECT_ID: ${NOTIFY_FCM_PROJECT_ID:-}
      NOTIFY_FCM_SERVICE_ACCOUNT_JSON: ${NOTIFY_FCM_SERVICE_ACCOUNT_JSON:-}
      NOTIFY_APNS_AUTH_KEY: ${NOTIFY_APNS_AUTH_KEY:-}
      NOTIFY_APNS_KEY_ID: ${NOTIFY_APNS_KEY_ID:-}
      NOTIFY_APNS_TEAM_ID: ${NOTIFY_APNS_TEAM_ID:-}
      NOTIFY_APNS_TOPIC: ${NOTIFY_APNS_TOPIC:-}
      NOTIFY_SMS_ENDPOINT: ${NOTIFY_SMS_ENDPOINT:-}
      NOTIFY_SMS_TOKEN: ${NOTIFY_SMS_TOKEN:-}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${NOTIFY_TELEGRAM_BOT_TOKEN:-}
      LOG_LEVEL: debug
      REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
