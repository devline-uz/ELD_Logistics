# ONEBOOK ELD — Prometheus scrape configuration (namunа / sample).
#
# /metrics is gated by METRICS_ENABLED / METRICS_TOKEN / METRICS_ALLOW_CIDR
# (internal/middleware/gate.go). In staging and production config.Validate
# refuses to boot an unguarded surface, so the scrape job must present the
# bearer token below. Keep the real token in a secret file, never in git.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: onebook-eld
    env: production
    region: pk-south

rule_files:
  - /etc/prometheus/rules/eld.rules.yml

scrape_configs:
  - job_name: eld-api
    metrics_path: /metrics
    scheme: http
    # METRICS_TOKEN of the API deployment.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/eld_metrics_token
    static_configs:
      - targets: ["api:8080"]
        labels:
          component: api

  - job_name: eld-worker
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/eld_metrics_token
    static_configs:
      - targets: ["worker:8081"]
        labels:
          component: worker

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

# --------------------------------------------------------------------------
# Series exported by the application (internal/metrics):
#
#   eld_http_request_duration_seconds{route,method,status}  histogram
#   eld_http_requests_in_flight                             gauge
#   eld_http_response_size_bytes{route}                     histogram
#   eld_ws_connections                                      gauge
#   eld_db_pool_acquired_connections                        gauge
#   eld_db_pool_idle_connections                            gauge
#   eld_db_pool_total_connections                           gauge
#   eld_queue_tasks{queue,state}                            gauge
#   eld_queue_latency_seconds{queue}                        gauge
#   eld_queue_scrape_errors_total                           counter
#
# `route` is always the chi route pattern (/api/v1/units/{id}), never a
# concrete path: an id must not become a label value.
#
# Suggested alert rules (/etc/prometheus/rules/eld.rules.yml):
#
#   - alert: EldApiLatencyHigh
#     expr: histogram_quantile(0.95,
#             sum by (le, route) (rate(eld_http_request_duration_seconds_bucket[5m]))) > 1
#     for: 10m
#
#   - alert: EldApiErrorRateHigh
#     expr: sum(rate(eld_http_request_duration_seconds_count{status=~"5.."}[5m]))
#           / sum(rate(eld_http_request_duration_seconds_count[5m])) > 0.02
#     for: 5m
#
#   - alert: EldQueueLag
#     expr: max by (queue) (eld_queue_latency_seconds) > 300
#     for: 10m
#
#   - alert: EldDbPoolSaturated
#     expr: eld_db_pool_idle_connections == 0
#           and eld_db_pool_acquired_connections >= eld_db_pool_total_connections
#     for: 5m
#
#   - alert: EldWorkerDown
#     expr: up{job="eld-worker"} == 0
#     for: 2m
